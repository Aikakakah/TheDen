# cargo variants

- type: entity
  parent: [ ClothingUniformBase, ClothingUniformFoldableBase ]
  id: ClothingUniformJumpsuitCargoLight
  name: light cargo tech jumpsuit
  description: A sturdy jumpsuit, issued to members of the Cargo department.
  suffix: light
  components:
  - type: Sprite
    sprite: _CD/Clothing/Uniforms/Jumpsuit/cargotech_light.rsi
  - type: Clothing
    sprite: _CD/Clothing/Uniforms/Jumpsuit/cargotech_light.rsi

- type: entity
  parent: [ ClothingUniformBase, ClothingUniformFoldableBase ]
  id: ClothingUniformJumpsuitCargoDark
  name: dark cargo tech jumpsuit
  suffix: dark
  description: A sturdy jumpsuit, issued to members of the Cargo department.
  components:
  - type: Sprite
    sprite: _CD/Clothing/Uniforms/Jumpsuit/cargotech_dark.rsi
  - type: Clothing
    sprite: _CD/Clothing/Uniforms/Jumpsuit/cargotech_dark.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitCargoOveralls
  name: cargo overalls
  description: A set of sturdy tan overalls worn by cargo techs wanting more coverage.
  components:
  - type: Sprite
    sprite: _CD/Clothing/Uniforms/Jumpsuit/cargo_overalls.rsi
  - type: Clothing
    sprite: _CD/Clothing/Uniforms/Jumpsuit/cargo_overalls.rsi

- type: entity
  parent: [ ClothingUniformBase, ClothingUniformFoldableBase ] # CD foldable
  id: ClothingUniformJumpsuitCargoPants
